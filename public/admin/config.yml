backend:
  name: git-gateway
  branch: main

media_folder: "public/assets"
public_folder: "/assets"
logo_url: "/assets/logo.png"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - label: "Announcement Banner"
        name: "banner"
        file: "src/data/banner.json"
        description: "The dismissible banner shown at the top of every page."
        fields:
          - {label: "Show Banner", name: "enabled", widget: "boolean", default: false, hint: "Turn this on to display the banner, off to hide it without deleting the message."}
          - {label: "Icon (emoji)", name: "icon", widget: "string", required: false}
          - {label: "Message", name: "message", widget: "text"}

      - label: "Homepage"
        name: "home"
        file: "src/data/home.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
              - {label: "Button Text", name: "buttonText", widget: "string"}
          - label: "Highlight Cards"
            name: "highlights"
            widget: "list"
            min: 4
            max: 4
            hint: "These 4 cards link to Blog, Competition Results, Festival Years, and Gallery, in that order. Only the text can be edited here."
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "text", widget: "text"}
              - {label: "Link Text", name: "linkText", widget: "string"}
          - label: "Join Us Section"
            name: "joinUs"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Paragraph 1", name: "paragraph1", widget: "text"}
              - {label: "Paragraph 2", name: "paragraph2", widget: "text"}

      - label: "Social Media Links"
        name: "socialLinks"
        file: "src/data/socialLinks.json"
        fields:
          - {label: "Instagram URL", name: "instagram", widget: "string"}
          - {label: "YouTube URL", name: "youtube", widget: "string"}
          - {label: "Facebook URL", name: "facebook", widget: "string"}

      - label: "About Page"
        name: "about"
        file: "src/data/about.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "Intro Paragraph 1", name: "introParagraph1", widget: "text"}
          - {label: "Intro Paragraph 2", name: "introParagraph2", widget: "text"}
          - label: "Founders"
            name: "founders"
            widget: "list"
            min: 1
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image"}
              - {label: "Bio", name: "bio", widget: "text"}
          - {label: "Vision", name: "vision", widget: "text"}
          - {label: "Mission", name: "mission", widget: "text"}
          - {label: "Our Journey Text", name: "journeyText", widget: "text"}
          - {label: "Inaugural Festival Date", name: "inauguralDate", widget: "string"}
          - {label: "Inaugural Festival Location", name: "inauguralLocation", widget: "string"}

      - label: "Contact Page"
        name: "contact"
        file: "src/data/contact.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "Public Contact Email", name: "email", widget: "string"}
          - {label: "Mailing Address", name: "address", widget: "string"}

      - label: "Festival Years Page"
        name: "festivalYearsPage"
        file: "src/data/festivalYears.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "Intro Title", name: "introTitle", widget: "string"}
          - {label: "Intro Text", name: "introText", widget: "text"}

      - label: "Festival Reviews Page"
        name: "reviews"
        file: "src/data/reviews.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            hint: "Add, edit, or remove attendee testimonials."
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Author Name", name: "author", widget: "string"}
              - {label: "Author Title (optional)", name: "title", widget: "string", required: false}
          - {label: "Impact Section Heading", name: "impactHeading", widget: "string"}
          - {label: "Impact Section Text", name: "impactText", widget: "text"}
          - label: "Impact Stats"
            name: "stats"
            widget: "list"
            fields:
              - {label: "Number", name: "number", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}

      - label: "Vendors Page (Intro)"
        name: "vendors"
        file: "src/data/vendors.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "About Paragraph 1", name: "aboutParagraph1", widget: "text"}
          - {label: "About Paragraph 2", name: "aboutParagraph2", widget: "text"}
          - {label: "Payment Note", name: "paymentNote", widget: "text"}

      - label: "Vendor Guidelines Page"
        name: "vendorGuidelines"
        file: "src/data/vendorGuidelines.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "Overview Text", name: "overviewText", widget: "text"}
          - {label: "Guidelines (full text)", name: "guidelinesBody", widget: "markdown", hint: "Covers eligibility, booth pricing, payment policy, presentation & product standards, and vendor responsibilities. Use headings (###) to start a new section."}
          - {label: "Application Process Intro", name: "applicationProcessText", widget: "text"}
          - label: "Application Steps"
            name: "applicationSteps"
            widget: "list"
            min: 3
            max: 3
            fields:
              - {label: "Icon (Font Awesome class)", name: "icon", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - {label: "FAQ (full text)", name: "faqBody", widget: "markdown", hint: "Use headings (###) for each question."}
          - {label: "Vendor Coordinator Email", name: "contactEmail", widget: "string"}
          - {label: "Vendor Coordinator Phone", name: "contactPhone", widget: "string"}

      - label: "Community Outreach Page"
        name: "communityOutreach"
        file: "src/data/communityOutreach.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - {label: "Sponsorship Heading", name: "sponsorshipHeading", widget: "string"}
          - {label: "Sponsorship Paragraph 1", name: "sponsorshipParagraph1", widget: "text"}
          - {label: "Sponsorship Paragraph 2", name: "sponsorshipParagraph2", widget: "text"}
          - {label: "Highlight Note", name: "highlightNote", widget: "text"}
          - {label: "Sponsorship Paragraph 3", name: "sponsorshipParagraph3", widget: "text"}
          - {label: "Gallery Heading", name: "galleryHeading", widget: "string"}
          - {label: "Gallery Caption", name: "galleryCaption", widget: "text"}

  - name: "festivalYears"
    label: "Festival Years"
    folder: "src/data/festivalYears"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}"
    identifier_field: "year"
    summary: "{{year}} — {{description}}"
    hint: "One entry per festival year — works just like Blog Posts. Click 'New Festival Years' below, fill in at least Year/Card Description/Card Poster so it shows up on the Festival Years timeline, and optionally expand 'Full Festival Details' in the same form to also publish a complete detail page (presenters, schedule, venue, etc.) at /festival-page/<year>. No separate page or URL to manage — it's all in this one entry."
    fields:
      - {label: "Year", name: "year", widget: "string", hint: "e.g. 2026"}
      - {label: "Card Description", name: "description", widget: "text", hint: "Short blurb shown on the Festival Years timeline card."}
      - {label: "Card Poster Image", name: "poster", widget: "image", required: false, hint: "Shown on the Festival Years timeline card."}
      - label: "Full Festival Details (optional)"
        name: "fullDetails"
        widget: "object"
        required: false
        collapsed: true
        hint: "Fill this in to also publish a full detail page for this year, automatically linked from the timeline card. Leave collapsed/empty if you only want a simple timeline entry for now."
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
          - label: "Overview"
            name: "overview"
            widget: "object"
            required: false
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Stats"
                name: "stats"
                widget: "list"
                required: false
                fields:
                  - {label: "Number", name: "number", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
          - {label: "About Tab (full text)", name: "aboutBody", widget: "markdown", required: false, hint: "Use #### for the Our Vision / Our Mission / Join Us sub-headings."}
          - label: "Sponsors & Partners"
            name: "sponsors"
            widget: "object"
            required: false
            fields:
              - {label: "Caption Line 1", name: "caption1", widget: "text", required: false}
              - {label: "Caption Line 2 (hashtags)", name: "caption2", widget: "string", required: false}
              - {label: "Sponsors Collage Image", name: "image", widget: "image", required: false}
              - label: "Sponsors List"
                name: "list"
                widget: "list"
                required: false
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Description", name: "description", widget: "string"}
              - {label: "Individual Contributors", name: "contributors", widget: "list", required: false, hint: "One name per line."}
              - {label: "Partnership Note", name: "partnershipNote", widget: "text", required: false}
          - label: "Presenters"
            name: "presenters"
            widget: "list"
            required: false
            hint: "Add or remove presenters here. 'Featured' presenters show at the top of the Presenters tab."
            fields:
              - {label: "Featured Presenter?", name: "featured", widget: "boolean", default: false}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Title/Role", name: "title", widget: "string"}
              - {label: "Photo", name: "photo", widget: "image"}
              - {label: "Bio", name: "bio", widget: "text"}
              - {label: "Video Upload (optional)", name: "video", widget: "file", required: false, hint: "Use this OR the YouTube link below, not both."}
              - {label: "YouTube Embed URL (optional)", name: "youtubeUrl", widget: "string", required: false, hint: "Use the embed link, e.g. https://www.youtube.com/embed/VIDEO_ID"}
          - label: "Schedule"
            name: "schedule"
            widget: "object"
            required: false
            fields:
              - {label: "Intro Text", name: "introText", widget: "text", required: false}
              - label: "Opening & Presentations"
                name: "openingSection"
                widget: "object"
                required: false
                fields:
                  - {label: "Section Title", name: "title", widget: "string"}
                  - {label: "Items", name: "items", widget: "list"}
              - label: "Performers"
                name: "performersSection"
                widget: "object"
                required: false
                fields:
                  - {label: "Section Title", name: "title", widget: "string"}
                  - {label: "Items", name: "items", widget: "list"}
              - label: "Competition & Closing"
                name: "closingSection"
                widget: "object"
                required: false
                fields:
                  - {label: "Section Title", name: "title", widget: "string"}
                  - {label: "Items", name: "items", widget: "list"}
              - {label: "Note", name: "note", widget: "text", required: false}
          - label: "Venue"
            name: "venue"
            widget: "object"
            required: false
            fields:
              - {label: "Intro Text", name: "introText", widget: "text", required: false}
              - {label: "Venue Name", name: "name", widget: "string"}
              - {label: "Venue Photo", name: "image", widget: "image"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Extra Text", name: "extraText", widget: "text", required: false}
              - {label: "Facilities", name: "facilities", widget: "list", required: false}

  - name: "poetryCompetitions"
    label: "Poetry Competitions Page"
    files:
      - label: "Poetry Competitions Content"
        name: "poetryCompetitions"
        file: "src/data/poetryCompetitions.json"
        fields:
          - {label: "Hero Title", name: "heroTitle", widget: "string"}
          - {label: "Hero Subtitle", name: "heroSubtitle", widget: "text"}
          - label: "Current / Upcoming Event"
            name: "openMicNight"
            widget: "object"
            hint: "Use this block for whatever open event is currently happening or upcoming."
            fields:
              - {label: "Active (shown at the top)", name: "enabled", widget: "boolean", default: true, hint: "On = shown at the top of the page as the current event. Off = archived — moved down into the 'Past Competitions' section instead of being deleted."}
              - {label: "Mark as postponed?", name: "postponed", widget: "boolean", default: false}
              - {label: "Poster Image", name: "image", widget: "image"}
              - {label: "Event Title", name: "title", widget: "string"}
              - {label: "Theme Line", name: "theme", widget: "string", required: false}
              - {label: "Postponed Status Message", name: "statusBody", widget: "markdown", required: false}
              - {label: "Date/Time", name: "originalWhen", widget: "string"}
              - {label: "Location", name: "originalWhere", widget: "string"}
              - {label: "Cost", name: "cost", widget: "string"}
              - {label: "Intro Text", name: "introBody", widget: "markdown"}
              - {label: "Opportunities List", name: "opportunities", widget: "list"}
              - {label: "\"Wanna Perform?\" Text", name: "performInfoBody", widget: "markdown"}
              - {label: "Contact Email", name: "contactEmail", widget: "string"}
              - {label: "Hashtags", name: "hashtags", widget: "list"}
          - label: "Featured Challenge / Winner"
            name: "heritageChallenge"
            widget: "object"
            hint: "Use this to spotlight a past challenge winner. Turn 'Show this section' off to hide it."
            fields:
              - {label: "Show this section", name: "enabled", widget: "boolean", default: true}
              - {label: "Collaboration Text", name: "collaborationText", widget: "string", required: false}
              - {label: "Quote", name: "quote", widget: "string", required: false}
              - {label: "Quote Author", name: "quoteAuthor", widget: "string", required: false}
              - {label: "Winner Photo", name: "winnerImage", widget: "image"}
              - {label: "Winner Name", name: "winnerName", widget: "string"}
              - {label: "Winning Poem Title", name: "poemTitle", widget: "string"}
              - {label: "Intro Text", name: "introBody", widget: "markdown"}
              - {label: "Poem Description", name: "poemCardText", widget: "text"}
              - {label: "What's Next Steps", name: "nextSteps", widget: "list"}
              - {label: "Challenge Theme", name: "theme", widget: "string"}
              - {label: "Submission Deadline", name: "submissionDeadline", widget: "string"}
              - {label: "Submission Period", name: "submissionPeriod", widget: "string"}
              - {label: "Collaboration Credit", name: "collaboration", widget: "string"}
              - {label: "Hashtags", name: "hashtags", widget: "list"}
              - {label: "Feature Article Link (e.g. /blog/slug)", name: "featureLinkUrl", widget: "string"}
          - label: "Competition Recap"
            name: "competitionRecap"
            widget: "object"
            hint: "Recap of a completed competition (winners, finalists, stats). Turn 'Show this section' off to hide it."
            fields:
              - {label: "Show this section", name: "enabled", widget: "boolean", default: true}
              - {label: "Competition Name/Year", name: "year", widget: "string"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Dates", name: "dates", widget: "string"}
              - {label: "Overview Text", name: "overviewText", widget: "text"}
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Number", name: "number", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
              - label: "Winners"
                name: "winners"
                widget: "list"
                fields:
                  - {label: "Medal Emoji", name: "medal", widget: "string"}
                  - {label: "Place", name: "place", widget: "string"}
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Poem Title", name: "poemTitle", widget: "string"}
                  - {label: "Prize", name: "prize", widget: "string"}
                  - {label: "Tier", name: "tier", widget: "select", options: ["gold", "silver", "bronze"]}
              - label: "All Finalists"
                name: "finalists"
                widget: "list"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Poem Title", name: "poemTitle", widget: "string"}
                  - {label: "Badge Text", name: "badge", widget: "string"}
                  - {label: "Tier (blank if not a winner)", name: "tier", widget: "select", options: ["", "gold", "silver", "bronze"], required: false}
              - label: "Highlights"
                name: "highlights"
                widget: "list"
                fields:
                  - {label: "Icon (emoji)", name: "icon", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Text", name: "text", widget: "string"}
          - label: "Future Competitions"
            name: "futureSection"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Body", name: "body", widget: "markdown"}

  - name: "gallery"
    label: "Gallery Photos & Videos"
    folder: "src/data/gallery"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "caption"
    media_folder: "public/assets/gallery"
    public_folder: "/assets/gallery"
    fields:
      - {label: "Section", name: "section", widget: "select", options: ["Festival Highlights", "Festival Performance Videos", "Behind the Scenes & Preparation", "Poetry in Motion", "More from YouTube"], hint: "Which part of the Gallery page this appears in."}
      - {label: "Type", name: "mediaType", widget: "select", options: ["Photo", "Video File", "YouTube Video"]}
      - {label: "Photo", name: "image", widget: "image", required: false, hint: "Required if Type is Photo."}
      - {label: "Video File", name: "video", widget: "file", required: false, hint: "Required if Type is Video File. Upload an .mp4."}
      - {label: "YouTube Embed URL", name: "youtubeUrl", widget: "string", required: false, hint: "Required if Type is YouTube Video. Use the embed link, e.g. https://www.youtube.com/embed/VIDEO_ID"}
      - {label: "Caption (optional)", name: "caption", widget: "string", required: false}
      - {label: "Display Order", name: "order", widget: "number", required: false, value_type: "int", hint: "Lower numbers show first within their section. Leave blank to show last."}

  - name: "competitions"
    label: "Competitions"
    folder: "src/data/competitions"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{status}}"
    fields:
      - {label: "Status", name: "status", widget: "select", options: ["Active", "Archived"], default: "Active", hint: "Active = shown at the TOP of the page under 'Current Competitions'. Archived = moved down into the 'Past Competitions' section. Flip this instead of deleting old competitions."}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Year", name: "competitionYear", widget: "string", required: false}
      - {label: "Tagline", name: "tagline", widget: "string", required: false}
      - {label: "Dates", name: "dates", widget: "string", required: false}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Description", name: "description", widget: "markdown", required: false}
      - label: "Winners"
        name: "winners"
        widget: "list"
        required: false
        fields:
          - {label: "Medal Emoji", name: "medal", widget: "string", required: false}
          - {label: "Place", name: "place", widget: "string", required: false}
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Poem Title", name: "poemTitle", widget: "string", required: false}
          - {label: "Prize", name: "prize", widget: "string", required: false}
      - label: "Highlights"
        name: "highlights"
        widget: "list"
        required: false
        fields:
          - {label: "Icon (emoji)", name: "icon", widget: "string", required: false}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Text", name: "text", widget: "string"}
      - {label: "Link URL (optional, e.g. /blog/slug)", name: "linkUrl", widget: "string", required: false}
      - {label: "Link Text", name: "linkText", widget: "string", required: false}

  - name: "blog"
    label: "Blog Posts"
    folder: "src/data/blog"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string", hint: "Just the last part of the page URL — do NOT include /blog/. For example, if the URL should be vibrationspoetryfestival.com/blog/my-post, enter only: my-post. Lowercase, hyphens instead of spaces, no spaces or slashes."}
      - {label: "Category", name: "category", widget: "select", options: ["Poet Feature", "Book Review", "Festival Review", "Culture", "Interview", "History"]}
      - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Author Name", name: "author", widget: "string"}
      - {label: "Author Title", name: "authorTitle", widget: "string", required: false}
      - {label: "Excerpt (shown on Blog listing page)", name: "excerpt", widget: "text"}
      - {label: "Featured Image (optional)", name: "image", widget: "image", required: false}
      - {label: "Featured Image Link (optional)", name: "imageLink", widget: "string", required: false}
      - {label: "Featured Image Caption (optional)", name: "imageCaption", widget: "string", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Article Body", name: "body", widget: "markdown"}
      - {label: "Call-to-action Heading (optional)", name: "ctaHeading", widget: "string", required: false}
      - {label: "Call-to-action Text (optional)", name: "ctaText", widget: "text", required: false}
      - {label: "Call-to-action Link Text (optional)", name: "ctaLinkText", widget: "string", required: false}
      - {label: "Call-to-action Link URL (optional)", name: "ctaLinkUrl", widget: "string", required: false}
